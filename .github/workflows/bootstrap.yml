# Workflow PONCTUEL (supprimé juste après son exécution) :
# génère sur GitHub ce que l'environnement de développement assisté ne pouvait pas générer faute d'accès réseau
#   - le Maven Wrapper (backend/mvnw, mvnw.cmd, .mvn/wrapper/)
#   - frontend/package-lock.json
# puis démarre l'image complète, exécute des tests de fumée et capture des écrans de l'application.
# Le résultat est commité sur la branche de la PR.
name: Bootstrap (ponctuel)

on:
  push:
    branches: [feature/PW-phase-1-foundations]
    paths: ['.github/workflows/bootstrap.yml']

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Génération du Maven Wrapper
        working-directory: backend
        # only-script : aucun .jar binaire versionné, le script télécharge Maven lui-même.
        run: |
          mvn -B -ntp -N wrapper:wrapper -Dtype=only-script
          ./mvnw -v

      - name: Génération de package-lock.json
        working-directory: frontend
        run: npm install

      - name: Démarrage de l'image complète (PostgreSQL + PodWatch)
        run: |
          docker compose --profile app up -d --build
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null; then echo "PodWatch démarré"; exit 0; fi
            sleep 3
          done
          docker compose logs podwatch
          exit 1

      - name: Tests de fumée HTTP
        run: |
          set -e
          echo "--- /actuator/health";      curl -fsS http://localhost:8080/actuator/health; echo
          echo "--- /api/v1/system/info";   curl -fsS http://localhost:8080/api/v1/system/info; echo
          echo "--- / (SPA)";               curl -fsS http://localhost:8080/ | grep -q '<div id="root">' && echo OK
          echo "--- /pods (route SPA)";     curl -fsS http://localhost:8080/pods | grep -q '<div id="root">' && echo OK
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/clusters)
          echo "--- /api/v1/clusters → $code (attendu 403)"; test "$code" = "403"
          echo "--- en-têtes de /api/v1/system/info"; curl -s -D - -o /dev/null http://localhost:8080/api/v1/system/info
          echo "--- en-têtes de /"; curl -s -D - -o /dev/null http://localhost:8080/
          curl -s -D - -o /dev/null http://localhost:8080/ | grep -qi 'content-security-policy' || { echo "CSP absente sur /"; exit 1; }

      - name: Captures d'écran (Chromium headless)
        run: |
          mkdir -p /tmp/shots docs/images
          cd /tmp/shots
          npm init -y >/dev/null
          npm install playwright@1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cat > shots.mjs <<'EOF'
          import { chromium } from 'playwright';
          const out = process.argv[2];
          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 }, locale: 'fr-FR' });
          await page.goto('http://localhost:8080/');
          await page.getByText('Backend connecté').waitFor({ timeout: 30000 });
          await page.screenshot({ path: `${out}/phase1-dashboard.png` });
          await page.goto('http://localhost:8080/une-route-inconnue');
          await page.getByText('Page introuvable').waitFor({ timeout: 30000 });
          await page.screenshot({ path: `${out}/phase1-not-found.png` });
          await browser.close();
          EOF
          node shots.mjs "$GITHUB_WORKSPACE/docs/images"

      - name: Logs de l'application
        if: always()
        run: docker compose logs podwatch | tail -100

      - name: Commit des fichiers générés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/mvnw backend/mvnw.cmd backend/.mvn frontend/package-lock.json docs/images
          git commit -m "chore: add Maven Wrapper, package-lock.json and app screenshots (generated by CI)"
          git push
